name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS app
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release app
        run: ./Scripts/build-app.sh

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent Swift3270.app Swift3270-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swift3270-macOS
          path: Swift3270-macOS.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Swift3270-macOS.zip --generate-notes
