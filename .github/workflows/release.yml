name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package, for example V0.1.3
        required: false
        type: string
      release_id:
        description: Optional GitHub release ID when the release has no usable tag
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift package
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == '' && inputs.release_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: Swift3270-release-binary
          path: .build/release/Swift3270

  release:
    name: Package GitHub release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_id != '')
    needs: swift
    runs-on: macos-14
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      RELEASE_ID: ${{ github.event.release.id || inputs.release_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app bundle
        env:
          SWIFT3270_BUILD: ${{ github.run_number }}
        run: |
          SWIFT3270_VERSION="${RELEASE_TAG#[vV]}" ./Scripts/build-app.sh

      - name: Package app and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent Swift3270.app Swift3270-macOS.zip
          shasum -a 256 Swift3270-macOS.zip > Swift3270-macOS.zip.sha256

      - name: Attach updater files to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$RELEASE_ID"
          if [[ -z "$release_id" ]]; then
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              --paginate \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" | head -n 1)"
          fi
          if [[ -z "$release_id" ]]; then
            echo "Release $RELEASE_TAG not found" >&2
            exit 1
          fi

          for asset in Swift3270-macOS.zip Swift3270-macOS.zip.sha256; do
            existing_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --jq ".[] | select(.name == \"$asset\") | .id" | head -n 1)"
            if [[ -n "$existing_id" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$existing_id"
            fi

            content_type="application/zip"
            if [[ "$asset" == *.sha256 ]]; then
              content_type="text/plain"
            fi
            curl \
              --fail-with-body \
              --location \
              --retry 3 \
              --request POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: $content_type" \
              --data-binary "@$asset" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$asset"
          done
