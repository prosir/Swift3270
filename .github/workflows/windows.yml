name: Windows

on:
  push:
    branches: [main]
    paths:
      - "Windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Match the environment used by SwiftCrossUI's own Windows CI. This
      # exposes MSVC, the Windows SDK and the native librarian to SwiftPM.
      - name: Set up Visual Studio environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5

      - name: Install Swift 6.3
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3-release
          swift-build: 6.3-RELEASE

      - name: Show toolchain
        run: swift --version

      - name: Cache Swift dependencies
        uses: actions/cache@v4
        with:
          path: Windows/.build
          key: windows-swift-6.3-${{ hashFiles('Windows/Package.resolved') }}
          restore-keys: |
            windows-swift-6.3-

      - name: Run Windows core tests
        timeout-minutes: 10
        env:
          SWIFT3270_CORE_ONLY: "1"
        run: swift test --package-path Windows -c release --jobs 2

      # CWinRT contains hundreds of generated source files. Build it separately
      # from the core tests and limit concurrency to avoid memory pressure on
      # GitHub's Windows runner while its static library is archived.
      - name: Build Windows app
        timeout-minutes: 40
        run: swift build --package-path Windows -c release --product Swift3270Windows --jobs 2

      - name: Package app
        shell: pwsh
        run: |
          $exe = Get-ChildItem Windows\.build -Recurse -Filter Swift3270Windows.exe |
            Where-Object { $_.FullName -match '[\\/]release[\\/]' } |
            Select-Object -First 1
          if (-not $exe) { throw 'Swift3270Windows.exe is niet gevonden' }

          New-Item -ItemType Directory -Force Windows\dist | Out-Null
          Copy-Item $exe.FullName Windows\dist\Swift3270.exe
          Copy-Item Windows\README.md Windows\dist\README.md
          Compress-Archive -Path Windows\dist\* -DestinationPath Swift3270-Windows.zip -Force
          $hash = (Get-FileHash Swift3270-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Swift3270-Windows.zip" | Set-Content Swift3270-Windows.zip.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swift3270-Windows
          path: |
            Swift3270-Windows.zip
            Swift3270-Windows.zip.sha256

      - name: Attach files to published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Swift3270-Windows.zip Swift3270-Windows.zip.sha256 --clobber
