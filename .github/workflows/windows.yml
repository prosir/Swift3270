name: Windows

on:
  push:
    branches: [main]
    paths:
      - "Windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Visual Studio environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5

      - name: Install Swift 6.3
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3-release
          swift-build: 6.3-RELEASE

      - name: Show toolchain
        run: swift --version

      - name: Run Windows core tests
        timeout-minutes: 3
        env:
          SWIFT3270_CORE_ONLY: "1"
        run: swift test --package-path Windows --scratch-path "$env:RUNNER_TEMP\Swift3270-core" -c debug --jobs 4

  app-build:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Match the environment used by SwiftCrossUI's own Windows CI. This
      # exposes MSVC, the Windows SDK and the native librarian to SwiftPM.
      - name: Set up Visual Studio environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5

      - name: Install Swift 6.3
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3-release
          swift-build: 6.3-RELEASE

      - name: Show toolchain
        run: swift --version

      - name: Select build configuration
        shell: pwsh
        run: |
          $configuration = if ("${{ github.event_name }}" -eq "release") { "release" } else { "debug" }
          "SWIFT3270_BUILD_CONFIGURATION=$configuration" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Windows build configuration: $configuration"

      # Keep this cache separate from the core-test scratch directory. The
      # previous workflow let the dependency-free test manifest overwrite the
      # app workspace, so every run rebuilt all generated WinRT sources.
      - name: Restore compiled WinUI cache
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: Windows/.build
          key: windows-app-v3-swift-6.3-${{ github.event_name == 'release' && 'release' || 'debug' }}-${{ hashFiles('Windows/Package.swift', 'Windows/Package.resolved') }}
          restore-keys: |
            windows-app-v3-swift-6.3-${{ github.event_name == 'release' && 'release' || 'debug' }}-
            windows-swift-6.3-

      # Dependency resolution is deliberately left to this command, avoiding a
      # second 90-second SwiftPM graph load. Four jobs match the hosted runner's
      # CPU count and halve the cold-build bottleneck compared with --jobs 2.
      - name: Build Windows app
        timeout-minutes: 25
        run: swift build --package-path Windows -c $env:SWIFT3270_BUILD_CONFIGURATION --product Swift3270Windows --jobs 4

      # Save immediately after compilation. A later packaging/upload failure
      # must not discard another expensive, successful WinUI build.
      - name: Save compiled WinUI cache
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Windows/.build
          key: windows-app-v3-swift-6.3-${{ github.event_name == 'release' && 'release' || 'debug' }}-${{ hashFiles('Windows/Package.swift', 'Windows/Package.resolved') }}

      - name: Package app
        if: github.event_name != 'push'
        shell: pwsh
        run: |
          $configuration = [regex]::Escape($env:SWIFT3270_BUILD_CONFIGURATION)
          $exe = Get-ChildItem Windows\.build -Recurse -Filter Swift3270Windows.exe |
            Where-Object { $_.FullName -match "[\\/]$configuration[\\/]" } |
            Select-Object -First 1
          if (-not $exe) { throw 'Swift3270Windows.exe is niet gevonden' }

          New-Item -ItemType Directory -Force Windows\dist | Out-Null
          Copy-Item $exe.FullName Windows\dist\Swift3270.exe
          Copy-Item Windows\README.md Windows\dist\README.md
          Compress-Archive -Path Windows\dist\* -DestinationPath Swift3270-Windows.zip -Force
          $hash = (Get-FileHash Swift3270-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Swift3270-Windows.zip" | Set-Content Swift3270-Windows.zip.sha256

      - name: Upload Windows artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Swift3270-Windows
          path: |
            Swift3270-Windows.zip
            Swift3270-Windows.zip.sha256

      - name: Attach files to published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Swift3270-Windows.zip Swift3270-Windows.zip.sha256 --clobber
